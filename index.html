<head>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>FIT Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de una columna (máx. 680px) con barra de pestañas inferior; los niveles usan los colores de los discos olímpicos (verde 10 kg, amarillo 15 kg, azul 20 kg). */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --sunk:#e8eae6; --fg:#16181a; --muted:#5d6560; --line:#d5d9d3;
  --accent:#c8322b; --accent-fg:#ffffff;
  --lv1:#2f8a4c; --lv2:#c99a0e; --lv3:#2457b8;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121413; --surface:#1b1e1c; --sunk:#232724; --fg:#eef0ec; --muted:#9ba49d; --line:#2f3430;
  --accent:#e5534b; --accent-fg:#160807; --lv1:#4fbf72; --lv2:#e6bb37; --lv3:#6b9cf2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121413; --surface:#1b1e1c; --sunk:#232724; --fg:#eef0ec; --muted:#9ba49d; --line:#2f3430;
  --accent:#e5534b; --accent-fg:#160807; --lv1:#4fbf72; --lv2:#e6bb37; --lv3:#6b9cf2; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font:16px/1.5 var(--body);padding-inline:16px;padding-block:0 96px}
.wrap{max-width:680px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{font-family:var(--display);font-weight:800;font-size:1.5rem;text-transform:uppercase;letter-spacing:.04em}
.brand b{color:var(--accent)}
.who{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0}
.who img{width:26px;height:26px;border-radius:50%}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sect-h h2{font-size:1.9rem;text-transform:uppercase}
.sub{color:var(--muted);font-size:.9rem}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;padding:5px 12px;border-radius:99px;font-size:.85rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:left;width:100%}
.row .t{flex:1;min-width:0}
.row .n{font-weight:600;font-size:1.02rem}
.row .m{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glyph{flex:none;width:42px;height:42px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.8rem;text-transform:uppercase;color:var(--muted)}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.lvl i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.card h3{font-size:1.35rem}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted)}
.mono{font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.tag{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.pub{color:var(--lv3)}
.cardfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.fav{border:none;background:transparent;font-size:1.35rem;line-height:1;padding:4px;color:var(--muted)}
.fav[aria-pressed="true"]{color:var(--accent)}
.seg{display:flex;background:var(--sunk);border-radius:9px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{flex:1;border:none;background:transparent;padding:8px 6px;border-radius:7px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty strong{color:var(--fg);font-family:var(--display);font-size:1.3rem;text-transform:uppercase}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs div{display:flex;max-width:680px;width:100%}
nav.tabs button{flex:1;min-width:0;border:none;background:transparent;padding:8px 2px;font-family:var(--display);font-weight:700;font-size:.95rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-radius:8px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .plus{color:var(--accent-fg);background:var(--accent);margin-inline:4px}
nav.tabs .plus[aria-current="page"]{color:var(--accent-fg)}
/* hoja de detalle */
.sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:680px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.panel .close{float:right}
.panel h2{font-size:2rem;text-transform:uppercase;margin-bottom:6px}
.blk{margin-top:18px}
.blk h4{font-family:var(--display);font-size:1rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:8px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:8px}
ol.steps li::before{content:counter(s);font-family:var(--mono);font-size:.8rem;width:24px;height:24px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;margin-top:1px}
ul.dots{margin:0;padding-left:18px;display:grid;gap:4px}
.err{display:grid;gap:2px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0}
.err b{font-weight:600}
.err span{color:var(--muted);font-size:.92rem}
.musc{display:flex;flex-wrap:wrap;gap:6px}
.musc .tag.p{background:var(--fg);color:var(--bg)}
.video{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:var(--sunk);text-decoration:none;color:var(--fg);font-weight:600}
.video .play{width:40px;height:40px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.video .play::after{content:"";border-left:12px solid var(--accent-fg);border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.rx{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:center}
.rx div{background:var(--surface);padding:8px 4px}
.rx small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
/* formulario */
form{display:grid;gap:14px}
label.f{display:grid;gap:5px;font-size:.85rem;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea,.ex input,.ex textarea{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:400;color:var(--fg);font-size:1rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vis label{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);display:grid;gap:2px;cursor:pointer}
.vis label:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.vis input{position:absolute;opacity:0}
.vis b{font-size:.95rem}
.vis span{font-size:.8rem;color:var(--muted)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.ex-h{display:flex;align-items:center;gap:8px}
.ex-h .n{flex:1;font-weight:600;min-width:0}
.ex-h .idx{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid5 label{display:grid;gap:3px;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:center;min-width:0}
.grid5 input{padding:8px 4px;text-align:center;font-family:var(--mono);font-size:.9rem}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:6px;width:32px;height:32px;display:grid;place-items:center;font-size:1rem;color:var(--muted)}
.summary{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;color:var(--muted);padding:10px 0;border-top:1px solid var(--line)}
.summary b{color:var(--fg);font-family:var(--mono)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:30;font-size:.92rem}
.notice{padding:12px 14px;border-radius:8px;background:var(--sunk);color:var(--muted);font-size:.9rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid3 label,.grid4 label{display:grid;gap:3px;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;min-width:0;text-align:center}
.grid3 input,.grid4 input{width:100%;min-width:0;padding:8px 4px;text-align:center;font-family:var(--mono);font-size:.95rem;border:1px solid var(--line);background:var(--bg);border-radius:6px;color:var(--fg)}
.ingrow{display:grid;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.ingn{display:flex;align-items:center;gap:8px}
.ingn .nm{flex:1;min-width:0;font-weight:600;font-size:.95rem}
.inrow select,.msel{padding:8px 10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:.95rem;color:var(--fg)}
.msel{flex:1;min-width:0;font-weight:600}
.foto{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
.fotoed{display:grid;gap:6px}
.fotobtn{display:inline-flex;align-items:center;justify-self:start;cursor:pointer;position:relative}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
ul.ingl{margin:0;padding-left:18px;display:grid;gap:3px}
.mbar{display:grid;grid-template-columns:104px 1fr auto;gap:8px;align-items:center;font-size:.85rem}
.mbar .track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding-block:6px}
a.chip{text-decoration:none;color:var(--fg)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chk{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.have{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:.85rem}
.have .track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.have i{display:block;height:100%;background:var(--lv1);border-radius:99px}
.stl{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.stl li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:.95rem}
.stl .ic{font-family:var(--mono);font-weight:700;text-align:center}
.stl .ok{color:var(--lv1)} .stl .sb{color:var(--lv2)} .stl .no{color:var(--accent)}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl td.num{font-family:var(--mono);text-align:right}
.tbl tr.best td{font-weight:600}
.guestbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;margin-bottom:14px;border-radius:8px;background:var(--sunk);font-size:.88rem;color:var(--muted)}
.guestbar b{color:var(--fg)}
.guestbar.warn{border-left:3px solid var(--accent)}
.exp{width:100%;font-family:var(--mono);font-size:.75rem;padding:10px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
.firma{max-width:680px;margin:28px auto 0;padding-top:14px;border-top:1px solid var(--line);font-size:.75rem;line-height:1.5;color:var(--muted);text-align:center}
.firma b{color:var(--fg)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
/* diario */
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.datenav div{text-align:center;display:grid}
.datenav b{font-family:var(--display);font-size:1.3rem;text-transform:uppercase;letter-spacing:.03em}
.datenav span{font-size:.85rem;color:var(--muted)}
.stack{display:grid;gap:14px}
.inrow{display:flex;gap:8px;align-items:center}
.inrow input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-family:var(--mono);font-size:1.1rem}
.inrow .unit{color:var(--muted);font-weight:600}
.delta{font-family:var(--mono);font-size:.85rem}
.delta.up{color:var(--accent)} .delta.down{color:var(--lv1)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 2px;display:grid;gap:1px;font-size:.72rem;color:var(--muted);text-align:center}
.scale button b{font-family:var(--mono);font-size:1rem;color:var(--fg)}
.scale button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--fg)}
.card textarea,.card .txt{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-size:1rem}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 1fr 32px;gap:6px;align-items:center}
.set.h{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:center}
.set .no{font-family:var(--mono);font-size:.8rem;color:var(--muted);text-align:center}
.set input{width:100%;min-width:0;padding:8px 4px;text-align:center;font-family:var(--mono);font-size:.95rem;border:1px solid var(--line);background:var(--bg);border-radius:6px}
.prev{font-size:.8rem;color:var(--muted)}
.prev b{font-family:var(--mono);font-weight:500;color:var(--fg)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:2px;min-width:0}
.tile small{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tile b{font-family:var(--mono);font-size:1.15rem;font-weight:500;font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.1}
.chart .pt{fill:var(--accent)}
.chart .end{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.chart .endl{fill:var(--fg);font-weight:500}
@media (max-width:420px){.grid5{grid-template-columns:repeat(3,1fr)}.rx{grid-template-columns:repeat(2,1fr)}.tiles{grid-template-columns:1fr 1fr}nav.tabs button{font-size:.8rem;letter-spacing:.01em}}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">FIT <b>Community</b></div>
    <div class="who" id="who"></div>
  </header>
  <div id="guestbar"></div>
  <main id="view"></main>
  <footer class="firma" id="firma" data-owner="Milciades Fabritzio Vera Rodriguez"><b>FIT Community</b> · © 2026 Milciades Fabritzio Vera Rodriguez<br>Prototipo privado. Todos los derechos reservados.</footer>
</div>
<nav class="tabs" aria-label="Secciones"><div>
  <button data-tab="biblioteca" id="tab-biblioteca">Biblioteca</button>
  <button data-tab="rutinas" id="tab-rutinas">Rutinas</button>
  <button data-tab="dietas" id="tab-dietas">Dietas</button>
  <button data-tab="diario" id="tab-diario">Diario</button>
  <button data-tab="crear" id="tab-crear" class="plus">+ Crear</button>
</div></nav>
<div id="sheet-root"></div>

<script>
(() => {
const use = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n) : Promise.resolve(null);
const LEVELS = {
  principiante:{label:"Principiante", c:"var(--lv1)", kg:"10"},
  intermedio:{label:"Intermedio", c:"var(--lv2)", kg:"15"},
  avanzado:{label:"Avanzado", c:"var(--lv3)", kg:"20"}
};
const GRUPOS = ["Todos","Pecho","Espalda","Piernas","Hombros","Brazos","Core"];

const S = {
  tab:"biblioteca", grupo:"Todos", q:"", rutSeg:"mias",
  db:null, user:null, uid:null, canWrite:null, ready:false, dbMissing:false,
  ejercicios:[], publicas:{}, privadas:{}, favs:[], draft:null, editing:null, confirmDel:null,
  dias:{}, fecha:null, diaSeg:"hoy", log:null, rango:90, ejProg:null, pickFor:"rutina", wq:Promise.resolve(),
  guest:false, guestOk:true, g:null,
  dietasIdx:{}, planesPriv:{}, planesPubMine:{}, planCache:{}, dietSeg:"mias", crearSeg:"rutina", dDraft:null, dEditing:null, pickIngFor:0,
  have:[], basicos:true, filt:[], mom:"todos", preciosCom:[]
};
const hoyStr = () => new Date().toLocaleDateString("sv");
const shiftDate = (f, n) => { const d = new Date(f + "T12:00:00"); d.setDate(d.getDate() + n); return d.toLocaleDateString("sv"); };
const fmtFecha = (f, o) => new Date(f + "T12:00:00").toLocaleDateString("es-ES", o || {weekday:"long", day:"numeric", month:"long"});
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : null; };

function canSave(){ return S.guest ? true : !!(S.db && S.uid && S.canWrite !== false); }
function enterGuest(){
  S.guest = true; S.uid = S.uid || "local";
  const g = G.load();
  if (g === null) S.guestOk = false;
  S.g = {rutinas:g?.rutinas || {}, favs:g?.favs || [], dias:g?.dias || {}, planes:g?.planes || {}, precios:g?.precios || {}};
  applyGuest();
}
function applyGuest(){
  const pr = {}; Object.entries(S.g.rutinas).forEach(([id,r]) => pr[id] = {...r, id, autor:S.uid, publica:false});
  S.privadas = pr; S.favs = S.g.favs.slice(); S.dias = {...S.g.dias}; S.planesPriv = {...S.g.planes};
}
function persistGuest(){ if (!G.save(S.g)) S.guestOk = false; applyGuest(); }
function datosExport(){
  const rutinas = Object.values(allRutinas()).filter(r => r.autor === S.uid).map(({autor, ...r}) => r);
  return {app:"FIT Community", formato:1, exportado:new Date().toISOString(), modo:S.guest ? "invitado" : "cuenta",
    rutinas, precios:misPrecios(), dietas:Object.entries({...S.planesPriv, ...S.planesPubMine}).map(([id, pl]) => ({id, publica:!!S.planesPubMine[id], ...pl})), favoritas:S.favs, dias:Object.values(S.dias).sort((a,b) => a.fecha < b.fecha ? -1 : 1)};
}
async function exportar(){
  const txt = JSON.stringify(datosExport(), null, 2);
  const dl = await use("downloads");
  if (dl){
    try { await dl.save({filename:`fit-community-${hoyStr()}.json`, data:txt}); toast("Archivo exportado"); return; }
    catch (e) { if (e?.code === "declined") return; }
  } else {
    try {
      const url = URL.createObjectURL(new Blob([txt], {type:"application/json"}));
      const a = document.createElement("a"); a.href = url; a.download = `fit-community-${hoyStr()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast("Archivo exportado"); return;
    } catch {}
  }
  openSheet(`<button class="btn sm close" data-close>Cerrar</button><h2>Tus datos</h2>

    <div class="blk"><button class="btn pri" data-copyexp>Copiar</button></div>`);
}

function duracion(r){
  const s = (r.ejercicios||[]).reduce((a,e)=> a + (+e.series||0) * (45 + (+e.descanso||0)), 0);

}
function musculos(r){
  const set = new Set();
  (r.ejercicios||[]).forEach(e => { const x = exById(e.ejId); if (x) set.add(x.grupo); });
  return [...set];
}

async function boot(){
  try { localStorage.getItem("fc_tab") && (S.tab = localStorage.getItem("fc_tab")); } catch {}
  render();
  const [db, user] = await Promise.all([use("db"), use("user")]);
  S.user = user; S.db = db;
  S.uid = user ? await user.id() : null;
  S.canWrite = user ? await user.can("data.write") : null;
  if (user){ user.me().then(me => { if (me?.name) $("#who").innerHTML = `<img alt="" src="${esc(me.avatarUrl)}"><span>${esc(me.name)}</span>`; }); }

  if (db){
    db.collection("ejercicios").orderBy("orden").onSnapshot(snap => {
      S.ejercicios = snap.docs.length ? snap.docs.map(d => ({id:d.id, ...d.data()})) : BIBLIOTECA_BASE.slice();
      S.ready = true; render(true);
    }, () => { S.ejercicios = BIBLIOTECA_BASE.slice(); S.ready = true; render(true); });
    db.collection("rutinas").onSnapshot(snap => {
      const out = {};
      snap.docs.forEach(d => { const rs = d.data().rutinas || {}; Object.entries(rs).forEach(([id,r]) => out[id] = {...r, id, autor:d.id, publica:true}); });
      S.publicas = out; resolveNames(); render(true);
    });
    db.collection("dietas").onSnapshot(snap => {
      const out = {}; snap.docs.forEach(d => out[d.id] = d.data().planes || {});
      S.dietasIdx = out; resolveNames(); render(true);
    });
    db.collection("precios").onSnapshot(snap => {
      const out = []; snap.docs.forEach(d => Object.entries(d.data().items || {}).forEach(([id, e]) => out.push({...e, id, autor:d.id})));
      S.preciosCom = out; render(true);
    });
  } else { S.ejercicios = BIBLIOTECA_BASE.slice(); S.ready = true; }

  if (db && S.uid && S.canWrite !== false){
    db.doc(`data/users/${S.uid}/mis`).onSnapshot(d => {
      const v = d.exists ? d.data() : {};
      const pr = {}; Object.entries(v.rutinas||{}).forEach(([id,r]) => pr[id] = {...r, id, autor:S.uid, publica:false});
      S.privadas = pr; S.favs = Array.isArray(v.favs) ? v.favs.slice() : []; render(true);
    });
    db.collection(`data/users/${S.uid}/mis/dias`).onSnapshot(snap => {
      const out = {}; snap.docs.forEach(d => out[d.id] = d.data());
      S.dias = out; render(true);
    });
    db.collection(`dietas/${S.uid}/planes`).onSnapshot(snap => {
      const out = {}; snap.docs.forEach(d => out[d.id] = d.data()); S.planesPubMine = out; render(true);
    });
    db.collection(`data/users/${S.uid}/mis/planes`).onSnapshot(snap => {
      const out = {}; snap.docs.forEach(d => out[d.id] = d.data()); S.planesPriv = out; render(true);
    });
  } else enterGuest();
  render();
}

function diaDe(f){ return S.dias[f] ? JSON.parse(JSON.stringify(S.dias[f])) : {fecha:f, peso:null, energia:null, molestias:"", notas:"", entrenos:[]}; }
async function guardarDia(f, patch){
  const next = {...diaDe(f), ...patch, fecha:f};
  S.dias = {...S.dias, [f]: next};
  if (S.guest){ S.g.dias[f] = next; persistGuest(); return; }
  const run = () => S.db.doc(`data/users/${S.uid}/mis/dias/${f}`).set(next);
  S.wq = S.wq.then(run, run);
  return S.wq;
}
function fechasOrden(){ return Object.keys(S.dias).sort(); }
function pesoAnterior(f){ const fs = fechasOrden().filter(x => x < f && S.dias[x].peso != null); return fs.length ? {f:fs.at(-1), p:S.dias[fs.at(-1)].peso} : null; }
function volumen(en){ return (en.ejercicios||[]).reduce((a,e)=> a + (e.sets||[]).reduce((b,s)=> b + (num(s.kg)||0)*(num(s.reps)||0), 0), 0); }
function nSeries(en){ return (en.ejercicios||[]).reduce((a,e)=> a + (e.sets||[]).length, 0); }
function e1rm(kg, reps){ kg = num(kg); reps = num(reps); if (!kg || !reps) return null; return reps === 1 ? kg : kg * (1 + reps/30); }
function ultimaVez(ejId, antesDe, excluirId){
  const fs = fechasOrden().filter(f => f <= antesDe).reverse();
  for (const f of fs){
    for (const en of (S.dias[f].entrenos||[])){
      if (en.id === excluirId) continue;
      const ej = (en.ejercicios||[]).find(e => e.ejId === ejId);
      if (ej && ej.sets?.length){
        const best = ej.sets.slice().sort((a,b) => (num(b.kg)||0)-(num(a.kg)||0) || (num(b.reps)||0)-(num(a.reps)||0))[0];
        return {f, best, n:ej.sets.length};
      }
    }
  }
  return null;
}
function logDesdeRutina(r){
  return {id:uidGen(), fecha:S.fecha, rutinaId:r?.id||null, rutinaNombre:r?.nombre||"Entreno libre", sensacion:null,
    duracion: r ? String(duracion(r)) : "", notas:"",
    ejercicios: (r?.ejercicios||[]).map(e => ({ejId:e.ejId, nombre:e.nombre, objetivo:`${e.series||"—"} × ${e.reps||"—"}${e.rir?` · RIR ${e.rir}`:""}`, variacion:"",
      sets: Array.from({length: Math.min(10, Math.max(1, +e.series || 3))}, () => ({kg:e.peso||"", reps:String(String(e.reps||"").match(/\d+/)?.[0]||""), rpe:""}))}))};
}
async function guardarLog(){
  const L = S.log;
  const ejercicios = L.ejercicios.map(e => ({ejId:e.ejId, nombre:e.nombre, objetivo:e.objetivo||"", variacion:(e.variacion||"").trim(),
    sets: e.sets.filter(s => num(s.reps) || num(s.kg)).map(s => ({kg:num(s.kg), reps:num(s.reps), rpe:num(s.rpe)}))})).filter(e => e.sets.length);
  if (!ejercicios.length){ toast("Anota al menos una serie con peso o repeticiones"); return false; }
  const entreno = {id:L.id, rutinaId:L.rutinaId, rutinaNombre:L.rutinaNombre, sensacion:L.sensacion, duracion:num(L.duracion), notas:(L.notas||"").trim(), ejercicios};
  const dia = diaDe(L.fecha);
  const i = dia.entrenos.findIndex(e => e.id === L.id);
  if (i >= 0) dia.entrenos[i] = entreno; else dia.entrenos.push(entreno);
  await guardarDia(L.fecha, {entrenos: dia.entrenos});
  return true;
}

function myPublicDoc(){ const m = {}; Object.values(S.publicas).filter(r => r.autor === S.uid).forEach(r => { const {id,autor,publica,...rest} = r; m[id] = rest; }); return m; }
function myPrivateMap(){ const m = {}; Object.values(S.privadas).forEach(r => { const {id,autor,publica,...rest} = r; m[id] = rest; }); return m; }
async function writePrivate(rutinas, favs){
  if (S.guest){ S.g.rutinas = rutinas; S.g.favs = favs; persistGuest(); return; }

async function writePublic(rutinas){

async function guardarRutina(r){
  const {id, publica, ...body} = r;
  let pub = myPublicDoc(), priv = myPrivateMap();

function niceStep(raw){ const p = 10 ** Math.floor(Math.log10(raw)); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function lineChart(pts, unit, label){
  if (pts.length < 2) return `<div class="notice">Necesitas al menos dos registros para ver la gráfica.</div>`;
  const W = 420, H = 200, L = 40, R = 52, T = 14, B = 26;
  const xs = pts.map(p => Date.parse(p.f + "T12:00:00"));
  const x0 = Math.min(...xs), x1 = Math.max(...xs) === x0 ? x0 + 864e5 : Math.max(...xs);
  let y0 = Math.min(...pts.map(p => p.y)), y1 = Math.max(...pts.map(p => p.y));
  const pad = Math.max((y1 - y0) * .15, unit === "kg" ? .5 : 1); y0 -= pad; y1 += pad;
  const step = niceStep((y1 - y0) / 4); y0 = Math.floor(y0 / step) * step; y1 = Math.ceil(y1 / step) * step;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const dec = step < 1 ? 1 : 0;
  let g = ""; for (let v = y0; v <= y1 + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmtN(v,dec)}</text>`;
  const P = pts.map((p,i) => [X(xs[i]), Y(p.y)]);
  const d = P.map((q,i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join("");
  const area = d + `L${P.at(-1)[0].toFixed(1)} ${H-B}L${P[0][0].toFixed(1)} ${H-B}Z`;
  const last = P.at(-1), fs = o => esc(fmtFecha(pts[o].f, {day:"numeric", month:"short"}));
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}
    <path class="ar" d="${area}"/><path class="ln" d="${d}"/>
    ${pts.length <= 40 ? P.slice(0,-1).map(q => `<circle class="pt" cx="${q[0]}" cy="${q[1]}" r="2.5"/>`).join("") : ""}
    <circle class="end" cx="${last[0]}" cy="${last[1]}" r="4.5"/>
    <text class="endl" x="${last[0]+8}" y="${last[1]+4}">${fmtN(pts.at(-1).y)}</text>
    <text x="${L}" y="${H-6}">${fs(0)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fs(pts.length-1)}</text></svg></div>`;
}
function vProgreso(){

document.addEventListener("click", async ev => {

  const d = t.dataset;
  if (d.tab){ S.tab = d.tab; S.confirmDel = null; try{localStorage.setItem("fc_tab", S.tab)}catch{}; render(); window.scrollTo(0,0); return; }

  if (d.hav){ if (!S.have.includes(d.hav)) S.have.push(d.hav); guardarDespensa(); render(); const i = $("#dq"); if (i){ i.focus(); } return; }
  if (d.unhav){ S.have = S.have.filter(x => x !== d.unhav); guardarDespensa(); render(); return; }

  if (d.mom){ S.mom = d.mom; guardarDespensa(); render(); return; }

    if (!cantidad || cantidad <= 0 || cantidad > 50000){ toast("Escribe el contenido del paquete en gramos o ml"); $("#pr-c").focus(); return; }
    t.disabled = true;
    try { await guardarPrecio({alimentoId:d.saveprecio, tienda, precio, cantidad, fecha:hoyStr()}); toast("Precio guardado"); preciosSheet(d.saveprecio); render(); }
    catch { t.disabled = false; toast("No se pudo guardar el precio"); }

  }
  if (d.rec2diet){ const rc = RECETAS.find(r => r.id === d.rec2diet); if (!S.dDraft) { S.dDraft = newPlan(); S.dDraft.comidas = []; S.dEditing = null; } S.dDraft.comidas.push(recetaAComida(rc)); closeSheet(); S.crearSeg = "dieta"; S.tab = "crear"; render(); window.scrollTo(0, document.body.scrollHeight); toast(`${rc.n} añadida a la dieta`); return; }
  /* dietas */

  if ("newdiet" in d){ S.tab = "crear"; S.crearSeg = "dieta"; render(); window.scrollTo(0,0); return; }
  if (d.cseg){ if (S.crearSeg === "rutina") syncForm(); else syncDieta(); S.crearSeg = d.cseg; render(); return; }

  if (d.planedit){ const id = d.planedit, pl = S.planesPriv[id] || S.planesPubMine[id]; if (!pl) return; S.dDraft = draftDesdePlan(pl, id, !!S.planesPubMine[id]); S.dEditing = id; S.confirmDel = null; closeSheet(); S.crearSeg = "dieta"; S.tab = "crear"; render(); window.scrollTo(0,0); return; }
  if (d.plancopy){ const r = allPlanes()[d.plancopy]; let pl = null; try { pl = await planCompleto(r); } catch {} if (!pl){ toast("No se pudo copiar la dieta"); return; }
    S.dDraft = {...draftDesdePlan(pl, uidGen(), false), nombre: pl.nombre + " (copia)", creada: undefined}; S.dEditing = null; closeSheet(); S.crearSeg = "dieta"; S.tab = "crear"; render(); window.scrollTo(0,0); toast("Copiada. Ajusta y guarda."); return; }
  if ("dcancel" in d){ S.dDraft = null; S.dEditing = null; S.confirmDel = null; render(); return; }
  if ("addmeal" in d){ syncDieta(); const n = S.dDraft.comidas.length; S.dDraft.comidas.push(newComida(MOMENTOS[[0,2,4,3,1,5][n] ?? 5])); render(); return; }
  if (d.crm !== undefined){ syncDieta(); S.dDraft.comidas.splice(+d.crm, 1); render(); return; }
  if (d.cmv !== undefined){ syncDieta(); const i = +d.cmv, j = i + (+d.dir), a = S.dDraft.comidas; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; render(); return; }
  if (d.addingr !== undefined){ syncDieta(); S.pickIngFor = +d.addingr; ingPicker(); return; }
  if (d.addalim){ const a = alim(d.addalim); const u = a.def || (a.liq ? "ml" : "g"); S.dDraft.comidas[S.pickIngFor].ingredientes.push({alimentoId:a.id, nombre:a.n, cantidad:(u === "g" || u === "ml") ? "100" : "1", unidad:u}); closeSheet(); render(); return; }
  if ("addmanual" in d){ const q = ($("#iq")?.value || "").trim(); if (!q) return; S.dDraft.comidas[S.pickIngFor].ingredientes.push({alimentoId:null, nombre:q, cantidad:"", unidad:"g", kcal:"", prot:"", carb:"", grasa:""}); closeSheet(); render(); return; }
  if (d.irm){ syncDieta(); const [i, j] = d.irm.split(".").map(Number); S.dDraft.comidas[i].ingredientes.splice(j, 1); render(); return; }
  if (d.fotorm !== undefined){ syncDieta(); S.dDraft.comidas[+d.fotorm].foto = null; render(); return; }
  if (d.askplandel){ syncDieta(); S.confirmDel = "p:" + d.askplandel; render(); return; }
  if (d.plandel){ try { await borrarPlan(d.plandel); toast("Dieta borrada"); } catch { toast("No se pudo borrar. Inténtalo de nuevo."); } S.confirmDel = null; S.dDraft = null; S.dEditing = null; S.tab = "dietas"; render(); return; }
  if ("copyexp" in d){ const ta = $("#exptxt"); try { await navigator.clipboard.writeText(ta.value); toast("Copiado"); } catch { ta.focus(); ta.select(); toast("Selecciona y copia el texto"); } return; }
  if (d.grupo){ S.grupo = d.grupo; S._qFocus=false; render(); return; }
  if (d.seg){ S.rutSeg = d.seg; S.confirmDel=null; render(); return; }
  if (d.go){ S.tab = d.go; S.crearSeg = "rutina"; render(); return; }
  if (d.ex){ exDetail(d.ex); return; }
  if (d.fav){ toggleFav(d.fav); return; }
  if (d.open){ rutinaDetail(d.open); return; }
  if (d.rx){ const r = allRutinas()[d.rx]; const e = r.ejercicios[+d.rxi]; exDetail(e.ejId, e); return; }
  if (d.edit){ const r = allRutinas()[d.edit]; S.draft = JSON.parse(JSON.stringify({id:r.id, nombre:r.nombre, descripcion:r.descripcion||"", nivel:r.nivel, publica:r.publica, ejercicios:r.ejercicios||[], creada:r.creada})); S.editing = r.id; S.crearSeg = "rutina"; S.tab="crear"; render(); window.scrollTo(0,0); return; }
  if (d.copy){ const r = allRutinas()[d.copy]; S.draft = {...newDraft(), nombre:r.nombre+" (copia)", descripcion:r.descripcion||"", nivel:r.nivel, ejercicios:JSON.parse(JSON.stringify(r.ejercicios||[]))}; S.editing=null; closeSheet(); S.crearSeg = "rutina"; S.tab="crear"; render(); toast("Copiada. Ajusta y guarda."); return; }
  if ("cancelEdit" in d){ S.draft=null; S.editing=null; S.confirmDel=null; render(); return; }
  if ("pick" in d){ syncForm(); S.pickFor = "rutina"; picker(); return; }
  if (d.add && S.pickFor === "log" && S.log){ const x = exById(d.add); S.log.ejercicios.push({ejId:x.id, nombre:x.nombre, objetivo:"", variacion:"", sets:[{kg:"",reps:"",rpe:""}]}); closeSheet(); render(); toast(`${x.nombre} añadido`); return; }
  /* diario */
  if (d.dseg){ S.diaSeg = d.dseg; render(); return; }
  if (d.day){ const n = shiftDate(S.fecha, +d.day); if (n <= hoyStr()){ S.fecha = n; S.confirmDel = null; render(); } return; }
  if ("savepeso" in d){ const p = num($("#peso").value); if (p == null || p < 25 || p > 350){ toast("Escribe un peso entre 25 y 350 kg"); return; } try { await guardarDia(S.fecha, {peso:p}); toast("Peso guardado"); } catch { toast("No se pudo guardar el peso"); } render(); return; }
  if (d.energia){ const v = +d.energia, cur = diaDe(S.fecha).energia; try { await guardarDia(S.fecha, {energia: cur === v ? null : v}); } catch { toast("No se pudo guardar"); } render(); return; }
  if ("savenotas" in d){ try { await guardarDia(S.fecha, {molestias:$("#molestias").value.trim(), notas:$("#notasdia").value.trim()}); toast("Notas guardadas"); } catch { toast("No se pudieron guardar las notas"); } render(); return; }
  if ("newlog" in d){ rutinaPickerLog(); return; }
  if ("startlog" in d){ const r = d.startlog ? allRutinas()[d.startlog] : null; S.log = logDesdeRutina(r); closeSheet(); render(); window.scrollTo(0,0); return; }
  if (d.trainnow){ S.fecha = hoyStr(); S.log = logDesdeRutina(allRutinas()[d.trainnow]); closeSheet(); S.tab = "diario"; render(); window.scrollTo(0,0); return; }
  if (d.editlog){ const en = diaDe(S.fecha).entrenos.find(e => e.id === d.editlog); S.log = {...JSON.parse(JSON.stringify(en)), fecha:S.fecha, duracion: en.duracion ?? "", ejercicios: en.ejercicios.map(e => ({...e, sets: e.sets.map(s => ({kg: s.kg ?? "", reps: s.reps ?? "", rpe: s.rpe ?? ""}))}))}; render(); window.scrollTo(0,0); return; }
  if (d.asklogdel){ S.confirmDel = "e:" + d.asklogdel; render(); return; }
  if (d.logdel){ const dia = diaDe(S.fecha); try { await guardarDia(S.fecha, {entrenos: dia.entrenos.filter(e => e.id !== d.logdel)}); toast("Entreno borrado"); } catch { toast("No se pudo borrar"); } S.confirmDel = null; render(); return; }
  if ("cancellog" in d){ S.log = null; render(); return; }
  if ("logpick" in d){ S.pickFor = "log"; picker(); return; }
  if (d.lrm){ S.log.ejercicios.splice(+d.lrm, 1); render(); return; }
  if (d.setadd){ const e = S.log.ejercicios[+d.setadd]; const last = e.sets.at(-1) || {kg:"",reps:"",rpe:""}; e.sets.push({kg:last.kg, reps:last.reps, rpe:""}); render(); return; }
  if (d.setrm){ const [i,j] = d.setrm.split(".").map(Number); S.log.ejercicios[i].sets.splice(j,1); render(); return; }
  if (d.sens){ const v = +d.sens; S.log.sensacion = S.log.sensacion === v ? null : v; render(); return; }
  if ("savelog" in d){ t.disabled = true; try { if (await guardarLog()){ toast("Entreno guardado"); S.fecha = S.log.fecha; S.log = null; S.diaSeg = "hoy"; render(); window.scrollTo(0,0); } else t.disabled = false; } catch { t.disabled = false; toast("No se pudo guardar el entreno. Inténtalo de nuevo."); } return; }
  if (d.rango !== undefined){ S.rango = +d.rango; render(); return; }
  if (d.ejprog){ S.ejProg = d.ejprog; render(); return; }
  if (d.add){ const x = exById(d.add); S.draft.ejercicios.push({ejId:x.id, nombre:x.nombre, series:"3", reps:"10", peso:"", descanso:"90", rir:"", notas:""}); closeSheet(); render(); toast(`${x.nombre} añadido`); return; }
  if (d.rm){ syncForm(); S.draft.ejercicios.splice(+d.rm,1); render(); return; }
  if (d.mv){ syncForm(); const i=+d.mv, j=i+(+d.dir), a=S.draft.ejercicios; if (j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; render(); return; }
  if (d.askDel){ S.confirmDel = d.askDel; render(); return; }
  if ("delNo" in d){ S.confirmDel=null; render(); return; }
  if (d.delYes){ try { await borrarRutina(d.delYes); toast("Rutina borrada"); } catch { toast("No se pudo borrar. Inténtalo de nuevo."); } S.confirmDel=null; if (S.editing===d.delYes){S.draft=null;S.editing=null;S.tab="rutinas";} render(); return; }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "q"){ S.q = t.value; S._qFocus = true; render(); return; }
  if (t.id === "pq"){ $("#plist").innerHTML = pickerList(t.value); return; }
  if (t.id === "iq"){ $("#ilist").innerHTML = ingList(t.value); return; }
  if (t.id === "pq2"){ $("#p2list").innerHTML = preciosList(t.value); return; }
  if (t.id === "basicos"){ S.basicos = t.checked; guardarDespensa(); render(); return; }
  if (t.id === "dq"){ const nq = normTxt(t.value.trim()); $("#dres").innerHTML = !nq ? "" : ALIMENTOS.filter(a => !S.have.includes(a.id) && normTxt(a.n).includes(nq)).slice(0, 12).map(a => `<button class="chip" data-hav="${a.id}">+ ${esc(a.n)}</button>`).join("") || `<span class="sub">No está en la lista de alimentos.</span>`; return; }
  if (S.dDraft && t.closest("#dform")){ if (t.type === "file") return; syncDieta(); refreshDietaTotals(); return; }
  if (S.log){
    if (t.dataset.l){ const [i,j,k] = t.dataset.l.split("."); S.log.ejercicios[+i].sets[+j][k] = t.value; return; }
    if (t.dataset.lv !== undefined){ S.log.ejercicios[+t.dataset.lv].variacion = t.value; return; }
    if (t.id === "l-dur"){ S.log.duracion = t.value; return; }
    if (t.id === "l-notas"){ S.log.notas = t.value; return; }
  }
  if (S.draft && t.closest("#rform")){ syncForm(); refreshSummary(); }
});
function syncForm(){
  const d = S.draft; if (!d || !$("#rform")) return;
  d.nombre = $("#f-nombre").value; d.descripcion = $("#f-desc").value; d.nivel = $("#f-nivel").value;
  d.publica = $("#vis-pub").checked;
  document.querySelectorAll("#rform [data-k]").forEach(inp => { const e = d.ejercicios[+inp.dataset.i]; if (e) e[inp.dataset.k] = inp.value.trim(); });
}
document.addEventListener("submit", async ev => {
  if (ev.target.id !== "rform") return;
  ev.preventDefault(); syncForm();
  const d = S.draft;
  if (!d.nombre.trim()){ toast("Ponle un nombre a la rutina"); $("#f-nombre").focus(); return; }
  if (!d.ejercicios.length){ toast("Añade al menos un ejercicio"); return; }
  const btn = $("#save"); btn.disabled = true; btn.textContent = "Guardando…";
  const now = Date.now();
  try {
    await guardarRutina({...d, nombre:d.nombre.trim(), creada:d.creada||now, actualizada:now});
    toast(d.publica ? "Guardada y publicada en Comunidad" : "Rutina guardada");
    S.draft = null; S.editing = null; S.tab = "rutinas"; S.rutSeg = "mias"; render(); window.scrollTo(0,0);
  } catch (e) {
    btn.disabled = false; btn.textContent = "Guardar rutina";
    toast(e?.code === "invalid_argument" ? "Tu acceso no permite guardar rutinas" : "No se pudo guardar. Inténtalo de nuevo.");
  }
});
document.addEventListener("change", async ev => {
  const t = ev.target; if (!t.dataset || t.dataset.foto === undefined || !t.files?.[0]) return;
  syncDieta(); const i = +t.dataset.foto;
  try { S.dDraft.comidas[i].foto = await comprimirFoto(t.files[0]); render(); } catch { toast("No se pudo leer la imagen"); }
});
document.addEventListener("submit", async ev => {
  if (ev.target.id !== "dform") return;
  ev.preventDefault(); syncDieta();
  const d = S.dDraft;
  if (!d.nombre.trim()){ toast("Ponle un nombre a la dieta"); $("#d-nombre").focus(); return; }
  if (!d.comidas.length){ toast("Añade al menos una comida"); return; }
  for (const [i, c] of d.comidas.entries()){
    if (!c.nombre.trim()){ toast(`Ponle nombre a la comida ${i+1}`); $(`#c-${i}-n`)?.focus(); return; }
    if (!c.ingredientes.length){ toast(`Añade ingredientes a "${c.nombre.trim()}"`); return; }
    if (!c.pasosTxt.trim()){ toast(`Escribe cómo se prepara "${c.nombre.trim()}"`); $(`#c-${i}-p`)?.focus(); return; }
  }
  const now = Date.now();
  const body = {nombre:d.nombre.trim(), descripcion:(d.descripcion||"").trim(), objetivo:d.objetivo, kcal:num(d.kcal), macros:{p:num(d.macros.p), c:num(d.macros.c), g:num(d.macros.g)},
    creada:d.creada || now, actualizada:now,
    comidas:d.comidas.map(c => ({id:c.id, momento:c.momento, nombre:c.nombre.trim(), foto:c.foto || null,
      pasos:c.pasosTxt.split("\n").map(x => x.trim()).filter(Boolean),
      ingredientes:c.ingredientes.map(i => i.alimentoId ? {alimentoId:i.alimentoId, nombre:i.nombre, cantidad:num(i.cantidad), unidad:i.unidad}
        : {alimentoId:null, nombre:i.nombre, cantidad:num(i.cantidad), unidad:i.unidad, kcal:num(i.kcal), prot:num(i.prot), carb:num(i.carb), grasa:num(i.grasa)})}))};
  if (JSON.stringify(body).length > 240000){ toast("La dieta pesa demasiado por las fotos. Quita alguna."); return; }
  const btn = $("#dsave"); btn.disabled = true; btn.textContent = "Guardando…";
  try {
    await guardarPlan({...body, id:d.id, publica:d.publica && !S.guest});
    toast(d.publica && !S.guest ? "Dieta guardada y publicada en Comunidad" : "Dieta guardada");
    S.dDraft = null; S.dEditing = null; S.tab = "dietas"; S.dietSeg = "mias"; render(); window.scrollTo(0,0);
  } catch (e) {
    btn.disabled = false; btn.textContent = S.dEditing ? "Guardar cambios" : "Guardar dieta";
    toast(e?.code === "invalid_argument" ? "Tu acceso no permite guardar dietas" : e?.code === "quota_exceeded" ? "No queda espacio para más dietas" : "No se pudo guardar. Inténtalo de nuevo.");
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
